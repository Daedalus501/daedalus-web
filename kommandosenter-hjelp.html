<!-- Hjelpesiden til kommandosenteret (2026-11-11). Ingen måling, ingen innlogging, ingen data hentes.
     ALT INNHOLD ligger i GUIDE nederst: én oppføring per kategori, norsk og engelsk side om side.
     Knappenavn skrives i [[doble klammer]]. Da kan sjekk-hjelp.mjs kontrollere at hvert navn fortsatt
     finnes i admin.html. Endres et navn eller en flyt i kommandosenteret: endre teksten i GUIDE og sett ny dato.
     Stegene beskriver hva man gjør og hva knappen heter, aldri hvor den står eller hvilken farge den har. -->
<style>
:root{--bg:#0b1626;--card:#13233a;--line:#25405f;--tx:#eaf2fb;--mut:#a9bdd6;--gold:#e0bb6a;--blue:#7fbdf0;--ui-bg:#0e1a2c;--ui-line:#3a5a80}
*{box-sizing:border-box}

.top{position:sticky;top:0;z-index:5;background:rgba(11,22,38,.96);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.btn{font:inherit;font-size:14px;font-weight:600;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}

.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px}
h1{font:400 34px/1.15 Fraunces,Georgia,serif;margin:6px 0 10px}
.kicker{color:var(--gold);font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.lead{color:var(--mut);max-width:62ch;margin:0 0 6px}
.stamp{color:var(--mut);font-size:13px;margin:0}
.intro{grid-column:1 / -1}
nav.toc{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:6px}
nav.toc h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:0 0 10px;font-weight:600}
nav.toc ol{list-style:none;margin:0;padding:0;counter-reset:t}
nav.toc li{counter-increment:t;margin:0 0 2px}
nav.toc a{display:block;padding:6px 10px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14.5px}
nav.toc a::before{content:counter(t) ". ";color:var(--gold);font-variant-numeric:tabular-nums}
nav.toc a:hover{background:var(--card)}
section.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin:0 0 22px;scroll-margin-top:84px}
section.cat>h2{font:500 24px/1.2 Fraunces,Georgia,serif;margin:0 0 6px}
section.cat>h2 .no{color:var(--gold);font-style:italic;margin-right:10px}
section.cat>p.what{color:var(--mut);margin:0 0 14px;max-width:70ch}
.task{border-top:1px solid var(--line);padding:14px 0 2px}
.task h3{font-size:16.5px;margin:0 0 6px;font-weight:600}
.task ol{margin:0 0 10px;padding-left:24px}
.task li{margin:0 0 5px;padding-left:4px;max-width:74ch}
.task li::marker{color:var(--gold);font-weight:600}
.note{color:var(--mut);font-size:14.5px;margin:0 0 10px;padding-left:12px;border-left:3px solid var(--line);max-width:74ch}
.ui{font-weight:600;background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:6px;padding:1px 7px;white-space:nowrap;font-size:.94em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.foot{color:var(--mut);font-size:13.5px;margin-top:26px}
noscript p{background:#3a2a12;border:1px solid #7a5a22;padding:12px 16px;border-radius:10px}
@media (max-width:860px){.top{position:static}section.cat{scroll-margin-top:12px}.wrap{grid-template-columns:1fr;gap:18px;padding-top:18px}nav.toc{position:static;max-height:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}h1{font-size:28px}section.cat{padding:18px 16px}.ui{white-space:normal}}
@media print{
  :root{--bg:#fff;--card:#fff;--line:#bbb;--tx:#000;--mut:#333;--gold:#000;--blue:#000;--ui-bg:#fff;--ui-line:#777}
  .top,.skip,nav.toc{display:none}
  .wrap{display:block;padding:0;max-width:none}
  body{font-size:11.5pt;line-height:1.45}
  section.cat{border:0;border-top:2px solid #000;border-radius:0;padding:10pt 0 0;margin:0 0 14pt;break-inside:auto}
  .task{break-inside:avoid}
  a{color:#000;text-decoration:none}
}
</style>

        { t: { no: "Følg en aktiv tur", en: "Follow an active trip" },
          no: ["En tur er aktiv fra guiden starter den i appen.", "I lista står tiden som er igjen til planlagt retur. Går turen over tiden, merkes den som overskredet.", "Åpne turen. [[Start og slutt]] viser når turen ble startet og planlagt retur.", "[[Tellinger underveis]] viser tellingene guiden har gjort. [[Tildelt utstyr]] viser kjøretøy og hundespann på turen.", "[[HMS / sikkerhetssjekk]] viser om sikkerhetssjekken er fullført før start.", "[[Hendelser]] viser det guiden har logget. En hendelse som er endret i appen, er merket med tidspunktet og den opprinnelige teksten. Bilder vises små. Trykk på et bilde for full størrelse."],
          en: ["A trip is active from the moment the guide starts it in the app.", "The list shows the time left until the planned return. If the trip runs over, it is marked as overdue.", "Open the trip. [[Start and end]] shows when the trip was started and the planned return.", "[[Headcounts along the way]] shows the headcounts the guide has done. [[Assigned equipment]] shows vehicles and dog teams on the trip.", "[[HSE / safety check]] shows whether the safety check was completed before the start.", "[[Events]] shows what the guide has logged. An event that was changed in the app is marked with the time and the original text. Photos are shown small. Select a photo for full size."] },
        { t: { no: "Avslutt en tur guiden glemte å avslutte", en: "Close a trip the guide forgot to close" },
          no: ["Åpne den aktive turen.", "Velg [[Avslutt turen her]].", "Kontroller tidspunktene for start og slutt, og skriv en grunn. Grunnen står i revisjonsloggen.", "Bekreft. Turen blir fullført med tiden du valgte."],
          en: ["Open the active trip.", "Choose [[Close the trip here]].", "Check the start and end times, and enter a reason. The reason is recorded in the audit log.", "Confirm. The trip is completed with the time you chose."] },
        { t: { no: "Godkjenn, avlys eller slett", en: "Approve, cancel or delete" },
          no: ["[[Godkjenn tur]] stempler turen som gjennomgått av administrator.", "[[Avlys tur]] setter turen til avlyst. Du må bekrefte. Turen blir stående i lista.", "[[Slett]] nederst i turen finnes bare for utkast og avlyste turer. Sletting kan ikke angres."],
          en: ["[[Approve trip]] stamps the trip as reviewed by an administrator.", "[[Cancel trip]] sets the trip to cancelled. You must confirm. The trip stays in the list.", "[[Delete]] at the bottom of the trip is only available for drafts and cancelled trips. Deletion cannot be undone."] },
        { t: { no: "Skriv ut turrapporten", en: "Print the trip report" },
          no: ["Åpne turen og velg [[Skriv ut rapport]]. Rapporten åpnes i et nytt vindu.", "Velg utskrift i nettleseren, eller lagre som PDF.", "[[Admin-merknad]] legger til en egen merknad fra deg. Guidens rapport endres aldri."],
          en: ["Open the trip and choose [[Print report]]. The report opens in a new window.", "Choose print in the browser, or save as PDF.", "[[Admin note]] adds a separate note from you. The guide’s report is never changed."] }
      ] },
    { id: "erklaering", t: { no: "Gjesteerklæring", en: "Guest declaration" },
      what: { no: "Gjestene leser og signerer selskapets erklæring før turen, på egen telefon med QR-kode eller på guidens telefon i appen. Hver signatur lagres med tidspunkt og versjonen gjesten leste.", en: "Guests read and sign your company’s declaration before the trip, on their own phone with a QR code or on the guide’s phone in the app. Each signature is stored with the time and the version the guest read." },
      tasks: [
        { t: { no: "Slå erklæringen på", en: "Turn the declaration on" },
          no: ["Under [[Planlegging og ressurser]] finner du [[Gjesteerklæring]]. Velg [[Åpne gjesteerklæringen]].", "Lagre teksten først (se neste oppgave). Guidene ser erklæringen i appen bare når den er slått på og det finnes en tekst.", "Velg [[Slå på]] og bekreft. Gjestene kan nå signere på egen telefon med QR-koden, eller på guidens telefon i appen.", "Vil du stoppe signeringen, velg [[Slå av]]. Signaturer som er lagret, blir liggende."],
          en: ["Under [[Planning and resources]] you find [[Guest declaration]]. Choose [[Open the guest declaration]].", "Save the text first (see the next task). Guides only see the declaration in the app when it is on and a text has been saved.", "Choose [[Turn on]] and confirm. Guests can now sign on their own phone with the QR code, or on the guide’s phone in the app.", "To stop the signing, choose [[Turn off]]. Signatures already stored are kept."],
          note: { no: "Bare organisasjonsadministrator kan slå erklæringen av og på, lagre tekster og bytte QR-kode.", en: "Only the organisation administrator can turn the declaration on or off, save texts and replace the QR code." } },
        { t: { no: "Skriv eller endre teksten", en: "Write or change the text" },
          no: ["Velg [[Åpne gjesteerklæringen]] og så [[Ny versjon]]. Skjemaet er fylt ut med teksten som gjelder nå.", "Fyll inn [[Tittel]] og teksten under [[Tekst på norsk]], [[Tekst på engelsk]] eller begge. [[Tittel på engelsk (valgfri)]] vises for gjester som leser på engelsk.", "Vil du stille ja/nei-spørsmål, velg [[Legg til spørsmål]] og skriv spørsmålet på ett eller begge språk. Kryss av for [[Påkrevd]] hvis gjesten må svare. [[Nøkkel]] lages av spørsmålet og kan bare ha små bokstaver a til z, tall og _.", "Kryss av for [[Krev fødselsdato]] bare når dere trenger alderen, for eksempel for en aldersgrense for å kjøre scooter.", "Velg [[Lagre som ny versjon]]. Se over teksten som vises etterpå: slik ligger den i databasen."],
          en: ["Choose [[Open the guest declaration]] and then [[New version]]. The form is filled in with the text that applies now.", "Fill in [[Title]] and the text under [[Text in Norwegian]], [[Text in English]] or both. [[Title in English (optional)]] is shown to guests who read in English.", "To ask yes/no questions, choose [[Add question]] and write the question in one or both languages. Tick [[Required]] if the guest must answer. The [[Key]] is made from the question and can only contain lower-case letters a to z, digits and _.", "Tick [[Require date of birth]] only when you need the age, for example for an age limit on driving a snowmobile.", "Choose [[Save as new version]]. Look over the text shown afterwards: this is how it is stored in the database."],
          note: { no: "En lagret versjon kan aldri endres eller slettes. Vil du rette noe, lager du en ny versjon. Hver signatur beholder versjonen gjesten leste, og alle versjoner står under [[Versjoner]]. Lagrer en annen administrator samtidig, får du beskjed, og teksten din blir stående i skjemaet.", en: "A saved version can never be changed or deleted. To correct something, make a new version. Each signature keeps the version the guest read, and all versions are listed under [[Versions]]. If another administrator saves at the same time, you are told, and your text stays in the form." } },
        { t: { no: "Skriv ut QR-koden for bussen eller garderoben", en: "Print the QR code for the bus or changing room" },
          no: ["Velg [[Åpne gjesteerklæringen]] og [[Skriv ut QR-koden]]. Arket åpnes i et nytt vindu, med forklaring på norsk og engelsk.", "Heng arket der gjestene venter. Gjesten skanner koden med kameraet og velger turen sin i lista.", "Koden gjelder bare turer med dagens dato.", "Har koden kommet på avveie, velg [[Bytt kode]] og bekreft. Gamle utskrifter slutter å virke med en gang, så skriv ut den nye. Turkodene påvirkes ikke."],
          en: ["Choose [[Open the guest declaration]] and [[Print the QR code]]. The sheet opens in a new window, with instructions in Norwegian and English.", "Put the sheet up where the guests wait. The guest scans the code with the camera and chooses their trip from the list.", "The code is valid for trips with today’s date only.", "If the code has got into the wrong hands, choose [[Replace the code]] and confirm. Old printouts stop working at once, so print the new one. The trip codes are not affected."] },
        { t: { no: "Skriv ut QR-koden for én tur", en: "Print the QR code for one trip" },
          no: ["Åpne turen under [[Turadministrasjon]].", "Under [[Gjesteerklæring]], velg [[Skriv ut QR-kode for turen]].", "Koden gjelder bare denne turen, til turen er fullført. Med appen 1.5.0 eller nyere kan guiden også vise koden på telefonen."],
          en: ["Open the trip under [[Trip administration]].", "Under [[Guest declaration]], choose [[Print the trip’s QR code]].", "The code is valid for this trip only, until the trip is completed. With app version 1.5.0 or later, the guide can also show the code on the phone."] },
        { t: { no: "Se hvem som har signert", en: "See who has signed" },
          no: ["Åpne turen. [[Erklæringer signert]] viser hvor mange av deltakerne som har signert, og hvem som mangler. I [[Turadministrasjon]] står det samme tallet ved dagens, aktive og klare turer.", "Velg [[Vis signaturene]]. Hver signatur står med navn, hvem som signerte (gjesten eller en foresatt), tidspunkt, svarene og signaturbildet.", "Velg [[Vis teksten]] for å se nøyaktig teksten gjesten leste, på språket gjesten valgte.", "Til tilsyn: [[Tilsynsmappe (PDF)]] har alle signaturene i perioden i del F, med signaturbildet og teksten gjesten leste."],
          en: ["Open the trip. [[Declarations signed]] shows how many of the participants have signed, and who is missing. In [[Trip administration]] the same figure is shown next to today’s, active and ready trips.", "Choose [[Show the signatures]]. Each signature is listed with the name, who signed (the guest or a parent or guardian), the time, the answers and the signature image.", "Choose [[Show the text]] to see exactly the text the guest read, in the language the guest chose.", "For inspections: [[Inspection file (PDF)]] has all the signatures in the period in part F, with the signature image and the text the guest read."],
          note: { no: "[[Aktiver likevel]] betyr at guiden aktiverte turen med overstyring i appen. [[Ikke signert]] viser hvem som mangler signatur nå. En gjest som er fjernet fra turen etter å ha signert, telles ikke, men signaturen står fortsatt i lista.", en: "[[Activate anyway]] means that the guide activated the trip with an override in the app. [[Not signed]] shows who is missing a signature now. A guest who was removed from the trip after signing is not counted, but the signature is still listed." } }
      ] },
    { id: "kart", t: { no: "Kart og løyper", en: "Map and routes" },
      what: { no: "Se hvor turene og guidene er, og planlegg løyper.", en: "See where the trips and guides are, and plan routes." },
      tasks: [
        { t: { no: "Bruk det operative kartet", en: "Use the operational map" },
          no: ["Velg [[Åpne kart]], eller rull til [[Operativt kart]].", "Slå lag av og på med knappene over kartet: [[Turer]], [[Oppmøte]], [[Observasjon]], [[SOS]] og [[Guider]].", "Guider på aktiv tur vises med siste posisjon og klokkeslett. Gjesteguider deles ikke i kartet.", "Trykk på et punkt for å se hva det er."],
          en: ["Choose [[Open map]], or scroll to [[Operational map]].", "Turn layers on and off with the buttons above the map: [[Trips]], [[Meeting point]], [[Observation]], [[SOS]] and [[Guides]].", "Guides on an active trip are shown with their latest position and time. Guest guides are not shared on the map.", "Select a point to see what it is."] },
        { t: { no: "Planlegg en løype", en: "Plan a route" },
          no: ["Velg [[Planlegg løype]] eller [[Åpne planlegger]].", "Planleggeren åpnes som egen side. Der tegner du ruter og punkter og deler dem på en tur."],
          en: ["Choose [[Plan route]] or [[Open planner]].", "The planner opens as its own page. There you draw routes and points and share them on a trip."] }
      ] },
    { id: "vaer", t: { no: "Vær og skred", en: "Weather and avalanche" },
      what: { no: "Vær fra MET og skredvarsel fra Varsom for stedet du velger.", en: "Weather from MET and the avalanche warning from Varsom for the place you choose." },
      tasks: [
        { t: { no: "Velg værsted og skredregion", en: "Choose weather location and avalanche region" },
          no: ["Trykk på et av værfeltene øverst: temperatur, vind eller sol. [[Vær og føre]] åpnes med detaljene.", "Velg [[Endre værsted]].", "Klikk i kartet der været skal hentes for, og skriv et [[Stedsnavn]].", "Velg [[Skredregion (Varsom)]].", "Velg [[Lagre]]. Valget gjelder denne organisasjonen på denne maskinen.", "[[Nullstill]] går tilbake til startstedet for en aktiv tur, eller for siste tur."],
          en: ["Select one of the weather fields at the top: temperature, wind or sun. [[Weather and conditions]] opens with the details.", "Choose [[Change weather location]].", "Click on the map where the weather should be fetched for, and enter a [[Place name]].", "Choose [[Avalanche region (Varsom)]].", "Choose [[Save]]. The choice applies to this organisation on this computer.", "[[Reset]] goes back to the start location of an active trip, or of the latest trip."] },
        { t: { no: "Les skredvarselet", en: "Read the avalanche warning" },
          no: ["[[Skredvarsel]] viser faregraden fra 1 til 5 for regionen du har valgt.", "Under står skredproblemet og hvor lenge varselet gjelder.", "Varsom publiserer daglig varsel omtrent fra 1. desember til 31. mai."],
          en: ["[[Avalanche warning]] shows the danger level from 1 to 5 for the region you have chosen.", "Below it are the avalanche problem and how long the warning is valid.", "Varsom publishes a daily warning roughly from 1 December to 31 May."],
          note: { no: "Vær og skredvarsel kan være forsinket eller unøyaktig. Kontroller alltid mot kilden før en beslutning.", en: "Weather and avalanche data may be delayed or inaccurate. Always check against the source before a decision." } }
      ] },
    { id: "hendelser", t: { no: "Hendelser og daglige rapporter", en: "Events and daily reports" },
      what: { no: "Det guidene logger i felt, og rapportene du tar ut samme dag.", en: "What the guides log in the field, and the reports you take out the same day." },
      tasks: [
        { t: { no: "Følg hendelsene", en: "Follow the events" },
          no: ["[[Hendelsesstrøm]] viser de siste hendelsene guidene har logget, med type, tur og tid.", "Trykk på Daedalus-merket øverst for å hente de nyeste.", "[[Siste rapporter]] viser turrapporter fra fullførte turer. Trykk på en rapport for å åpne den."],
          en: ["[[Event feed]] shows the latest events the guides have logged, with type, trip and time.", "Select the Daedalus emblem at the top to fetch the newest.", "[[Latest reports]] shows trip reports from completed trips. Select a report to open it."] },
        { t: { no: "Ta ut dagsrapporten", en: "Take out the daily report" },
          no: ["Velg [[Dagsrapport]].", "Et nytt vindu åpnes med dagens tall, skredvarsel, guider og siste hendelser.", "Velg utskrift i nettleseren, eller lagre som PDF.", "Åpnes ikke vinduet, blokkerer nettleseren sprettoppvinduer. Tillat dem for daedalus-app.no."],
          en: ["Choose [[Daily report]].", "A new window opens with today’s figures, the avalanche warning, guides and latest events.", "Choose print in the browser, or save as PDF.", "If the window does not open, the browser is blocking pop-ups. Allow them for daedalus-app.no."] },
        { t: { no: "Del dagens brief", en: "Share today’s brief" },
          no: ["Velg [[Dagens brief]].", "Velg [[Kopier til utklippstavle]].", "Lim teksten inn der teamet leser beskjeder."],
          en: ["Choose [[Today’s brief]].", "Choose [[Copy to clipboard]].", "Paste the text where the team reads messages."] }
      ] },
    { id: "hms", t: { no: "HMS-verktøy", en: "HSE tools" },
      what: { no: "Rapporter og oversikter for internkontroll og tilsyn. Alle ligger under [[HMS-verktøy]].", en: "Reports and overviews for internal control and inspections. All are found under [[HSE tools]]." },
      tasks: [
        { t: { no: "Skriv en egen HMS-rapport", en: "Write your own HSE report" },
          no: ["Velg [[Ny HMS-rapport (PDF)]].", "Skriv tittel, beskrivelse og tiltak. Du kan knytte rapporten til en tur.", "Velg [[Generer PDF]]. Rapporten får eget nummer og åpnes i nytt vindu."],
          en: ["Choose [[New HSE report (PDF)]].", "Enter a title, description and action taken. You can link the report to a trip.", "Choose [[Generate PDF]]. The report gets its own number and opens in a new window."] },
        { t: { no: "Tilsynsmappe, sesongrapport og statistikk", en: "Inspection file, season report and statistics" },
          no: ["Velg [[Tilsynsmappe (PDF)]], [[Sesongrapport (PDF)]] eller [[Hendelsesstatistikk]].", "Velg perioden med [[Fra]] og [[Til]].", "Velg [[Generer PDF]] eller [[Vis]].", "Tilsynsmappa samler turer og sikkerhetsstatus, hendelser og kvittering, sertifiseringer, avvik, revisjonslogg og gjesteerklæringer."],
          en: ["Choose [[Inspection file (PDF)]], [[Season report (PDF)]] or [[Event statistics]].", "Choose the period with [[From]] and [[To]].", "Choose [[Generate PDF]] or [[Show]].", "The inspection file gathers trips and safety status, events and acknowledgement, certifications, deviations, the audit log and guest declarations."] },
        { t: { no: "Fakturagrunnlag for innleide guider", en: "Invoicing basis for contracted guides" },
          no: ["Velg [[Fakturagrunnlag]] og perioden.", "Velg [[Vis]]. Lista viser turer og gjester per guide. Avlyste turer er holdt utenfor.", "Last ned som CSV, eller skriv ut."],
          en: ["Choose [[Invoicing basis]] and the period.", "Choose [[Show]]. The list shows trips and guests per guide. Cancelled trips are left out.", "Download as CSV, or print."] },
        { t: { no: "Sertifikater, beredskapsplan og logg", en: "Certificates, emergency plan and log" },
          no: ["[[Sertifikatoversikt]] viser alle sertifiseringer med utløpsdato. Rødt betyr at den går ut innen 30 dager.", "[[Beredskapsplan]] viser gjeldende plan og telefonen til vaktleder.", "[[Revisjonslogg]] viser hva som er gjort i kommandosenteret, når og av hvem.", "[[Rapportarkiv]] viser hvilke dokumenter som er laget, med nummer og tid. Selve PDF-ene lagres ikke, så lagre dem selv."],
          en: ["[[Certificate overview]] shows all certifications with expiry date. Red means it expires within 30 days.", "[[Emergency plan]] shows the current plan and the duty manager’s phone number.", "[[Audit log]] shows what has been done in the command centre, when and by whom.", "[[Report archive]] shows which documents have been generated, with number and time. The PDFs themselves are not stored, so save them yourself."] },
        { t: { no: "HMS-senteret", en: "The HSE centre" },
          no: ["Velg [[Åpne HMS-senter]].", "Bytt mellom [[Etterlevelse]], [[Team (30 d)]] og [[Guidetimer]].", "[[Eksporter turer (CSV)]] og [[Eksporter hendelser (CSV)]] laster ned lister du kan åpne i et regneark.", "[[Internkontroll (PDF)]] samler organisasjon, beredskapsplan, sikkerhetssjekker og avvik i én rapport."],
          en: ["Choose [[Open HSE centre]].", "Switch between [[Compliance]], [[Team (30 d)]] and [[Guide hours]].", "[[Export trips (CSV)]] and [[Export events (CSV)]] download lists you can open in a spreadsheet.", "[[Internal control (PDF)]] gathers the organisation, emergency plan, safety checks and deviations in one report."] }
      ] },
    { id: "vaktplan", t: { no: "Vaktplan", en: "Duty roster" },
      what: { no: "Hvem som har vakt, dag for dag. Guidene ser planen. Bare administrator endrer den.", en: "Who is on duty, day by day. The guides see the plan. Only an administrator changes it." },
      tasks: [
        { t: { no: "Sett opp vakter", en: "Set up duties" },
          no: ["Velg [[Vaktplan]] under [[HMS-verktøy]].", "Bla mellom ukene med pilene. [[I dag]] går til denne uka.", "For hver dag velger du guide og rolle: [[Vakt]], [[Vaktleder]] eller [[Beredskap]]. Trykk på plusstegnet for å legge til.", "Krysset ved siden av en vakt fjerner den.", "[[Last ned CSV]] eller [[Skriv ut uka]] når planen er klar."],
          en: ["Choose [[Duty roster]] under [[HSE tools]].", "Move between weeks with the arrows. [[Today]] goes to this week.", "For each day, choose the guide and role: [[On duty]], [[Duty manager]] or [[On call]]. Select the plus sign to add.", "The cross next to a duty removes it.", "[[Download CSV]] or [[Print the week]] when the plan is ready."] }
      ] },
    { id: "avvik", t: { no: "Avviksregister", en: "Deviation register" },
      what: { no: "Avvik med ansvarlig, frist og lukking.", en: "Deviations with a person responsible, deadline and closing." },
      tasks: [
        { t: { no: "Registrer og lukk avvik", en: "Register and close deviations" },
          no: ["Velg [[Avviksregister]] under [[HMS-verktøy]].", "Velg [[Nytt avvik]]. Skriv tittel og beskrivelse, velg alvorlighetsgrad, ansvarlig og frist.", "Velg [[Opprett avvik]].", "Hendelser med høy eller kritisk alvorlighetsgrad foreslås som avvik. Velg [[Opprett avvik]] på forslaget.", "[[Endre]] oppdaterer et avvik. [[Lukk avvik]] lukker det. Skriv hva som ble gjort.", "Bruk [[Åpne]], [[Lukkede]] og [[Alle]] for å filtrere. [[Last ned CSV]] gir hele lista."],
          en: ["Choose [[Deviation register]] under [[HSE tools]].", "Choose [[New deviation]]. Enter a title and description, choose severity, the person responsible and a deadline.", "Choose [[Create deviation]].", "Events with high or critical severity are suggested as deviations. Choose [[Create deviation]] on the suggestion.", "[[Edit]] updates a deviation. [[Close deviation]] closes it. Enter what was done.", "Use [[Open]], [[Closed]] and [[All]] to filter. [[Download CSV]] gives the whole list."] }
      ] },
    { id: "planlegging", t: { no: "Planlegging og ressurser", en: "Planning and resources" },
      what: { no: "Maler, kjøretøy, kalender og beskjeder til teamet.", en: "Templates, vehicles, calendar and messages to the team." },
      tasks: [
        { t: { no: "Lag en turmal", en: "Create a trip template" },
          no: ["Under [[Turmaler]] velger du [[Ny mal]].", "Skriv navn. Velg startsted, aktivitet, vanskelighet og hvem som eier malen. Legg til utstyr og notater.", "Velg [[Lagre mal]]. Malen blir synlig i appen når guiden lager en ny tur.", "[[Slett]] ved siden av en mal fjerner den."],
          en: ["Under [[Trip templates]], choose [[New template]].", "Enter a name. Choose start location, activity, difficulty and who owns the template. Add equipment and notes.", "Choose [[Save template]]. The template becomes visible in the app when the guide creates a new trip.", "[[Delete]] next to a template removes it."] },
        { t: { no: "Kjøretøy og hundespann", en: "Vehicles and dog teams" },
          no: ["[[Kjøretøy]] og [[Hundespann]] viser det organisasjonen har registrert.", "De legges inn i appen, ikke her."],
          en: ["[[Vehicles]] and [[Dog teams]] show what the organisation has registered.", "They are added in the app, not here."] },
        { t: { no: "Bruk turkalenderen", en: "Use the trip calendar" },
          no: ["Velg [[Turkalender]].", "Bla mellom månedene med pilene.", "Trykk på en tur for å åpne den. Trykk på en dag for å opprette en tur den dagen."],
          en: ["Choose [[Trip calendar]].", "Move between months with the arrows.", "Select a trip to open it. Select a day to create a trip on that day."] },
        { t: { no: "Send en kunngjøring til teamet", en: "Send an announcement to the team" },
          no: ["Velg [[Kunngjøring til teamet]].", "Skriv beskjeden.", "Velg [[Send kunngjøring]]. Guidene får et varsel i appen.", "Du ser hvor mange som fikk varselet, og kan sende e-post til resten."],
          en: ["Choose [[Announcement to the team]].", "Write the message.", "Choose [[Send announcement]]. The guides get a notification in the app.", "You see how many received the notification, and can send an email to the rest."] }
      ] },
    { id: "organisasjon", t: { no: "Organisasjon og abonnement", en: "Organisation and subscription" },
      what: { no: "Navn, vaktleder, beredskapsplan og betaling.", en: "Name, duty manager, emergency plan and payment." },
      tasks: [
        { t: { no: "Sett opp organisasjonen", en: "Set up the organisation" },
          no: ["Under [[Organisasjon]] velger du [[Innstillinger]].", "Fyll ut [[Organisasjonsnavn]] og [[Vaktleder-telefon]].", "Skriv beredskapsplanen: hvem som varsles, i hvilken rekkefølge, og hvor dere møtes.", "Velg [[Lagre]]. Planen og telefonen vises under [[Beredskapsplan]]."],
          en: ["Under [[Organisation]], choose [[Settings]].", "Fill in [[Organisation name]] and [[Duty manager phone]].", "Write the emergency plan: who is alerted, in which order, and where you meet.", "Choose [[Save]]. The plan and the phone number are shown under [[Emergency plan]]."] },
        { t: { no: "Abonnement og seter", en: "Subscription and seats" },
          no: ["Velg [[Abonnement]] øverst. Betalingssiden åpnes i en ny fane.", "Der endrer du antall seter og betalingskort, eller sier opp."],
          en: ["Choose [[Subscription]] at the top. The payment page opens in a new tab.", "There you change the number of seats and the payment card, or cancel."] }
      ] },
    { id: "hjelp", t: { no: "Feil og spørsmål", en: "Problems and questions" },
      what: { no: "Si fra når noe ikke virker.", en: "Tell us when something does not work." },
      tasks: [
        { t: { no: "Meld en feil eller et ønske", en: "Report a problem or a wish" },
          no: ["Velg [[Tilbakemelding]] øverst.", "Skriv hva du gjorde, hva som skjedde, og hva du ventet.", "Velg [[Send]]. Du kan også skrive til hello@daedalus-app.no, gjerne med skjermbilde."],

(function () {
  var en = false, l = "";
  try { l = String(new URLSearchParams(location.search).get("lang") || "").toLowerCase(); } catch (e) {}
  if (l === "en" || l === "no" || l === "nb") { en = (l === "en"); try { localStorage.setItem("dae_lang", en ? "en" : "no"); } catch (e) {} }
  else {
    var s = null; try { s = localStorage.getItem("dae_lang"); } catch (e) {}
    if (s === "en" || s === "no") en = (s === "en");
    else { var L = []; try { L = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""]; } catch (e) {}
      var no = false, any = false; for (var i = 0; i < L.length; i++) { var x = String(L[i] || ""); if (x) any = true; if (/^(nb|nn|no)\b/i.test(x)) { no = true; break; } } en = any && !no; }
  }
  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function fmt(t) { return esc(t).replace(/\[\[(.+?)\]\]/g, '<span class="ui">$1</span>'); }
  function date(iso) { try { return new Date(iso + "T12:00:00").toLocaleDateString(en ? "en-GB" : "nb-NO", { day: "numeric", month: "long", year: "numeric" }); } catch (e) { return iso; } }
  function $(id) { return document.getElementById(id); }
  function render() {
    var k = en ? "en" : "no", U = GUIDE.ui[k];
    document.documentElement.lang = en ? "en" : "no"; document.title = U.title;
    $("kicker").textContent = U.kicker; $("h1").textContent = U.h1; $("lead").textContent = U.lead; $("stamp").textContent = U.stamp + date(GUIDE.updated) + ".";
    $("tocH").textContent = U.toc; $("langBtn").textContent = U.lang; $("printBtn").textContent = U.print; $("backBtn").textContent = U.back; $("brandSub").textContent = U.sub; $("skip").textContent = U.skip;
    var toc = "", html = "";
    GUIDE.sections.forEach(function (sec, i) {
      toc += '<li><a href="#' + sec.id + '">' + esc(sec.t[k]) + "</a></li>";
      html += '<section class="cat" id="' + sec.id + '"><h2><span class="no">' + (i + 1) + "</span>" + esc(sec.t[k]) + '</h2><p class="what">' + fmt(sec.what[k]) + "</p>";
      sec.tasks.forEach(function (task) {
        html += '<div class="task"><h3>' + esc(task.t[k]) + "</h3><ol>" + task[k].map(function (st) { return "<li>" + fmt(st) + "</li>"; }).join("") + "</ol>" + (task.note ? '<p class="note">' + fmt(task.note[k]) + "</p>" : "") + "</div>";
      });
      html += "</section>";
    });
    html += '<p class="foot">' + esc(U.foot) + "</p>";
    $("toc").innerHTML = toc; $("innhold").innerHTML = html;
  }
  // Hopper rett til kategorien i adressen (uten glidende rulling), også etter språkbytte og når skriftene er lastet.
  function jump() {
    var h = location.hash, t = h ? document.getElementById(h.slice(1)) : null; if (!t) return;
    var root = document.documentElement, old = root.style.scrollBehavior;
    root.style.scrollBehavior = "auto"; t.scrollIntoView(); root.style.scrollBehavior = old;
  }
  render();
  $("langBtn").onclick = function () { en = !en; try { localStorage.setItem("dae_lang", en ? "en" : "no"); } catch (e) {} render(); jump(); };
  $("printBtn").onclick = function () { window.print(); };
  jump();
  var moved = false;
  ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (ev) { window.addEventListener(ev, function () { moved = true; }, { passive: true }); });
  function again() { if (!moved) jump(); }
  window.addEventListener("load", again);
  try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(again); } catch (e) {}
})();
</script>
