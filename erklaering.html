<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a1322">
<title>Erklæring · Daedalus</title>
<link rel="icon" href="/icon.png">
<!-- Gjestesiden for erklæringen (fase 1). Ingen analytics, ingen eksterne skrifter eller skript:
     siden snakker bare med Edge-funksjonen guest-declaration. Koden står i ?o= (orgens) eller ?t= (turens). -->
<style>
:root{
  --bg:#0a1322; --panel:#13233f; --panel2:#0d1a30; --line:#2a4468; --gold:#c9a24b; --sky:#4a9fe0; --sky2:#8cc6f5;
  --text:#e9eef5; --muted:#a3afc0; --red:#f2958b; --ink:#0a1322; --paper:#f7f4ec;
  --serif:Georgia,'Times New Roman',serif; --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans)}
main{max-width:560px;margin:0 auto;padding:12px 16px calc(40px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.brand{font-family:var(--serif);letter-spacing:.14em;font-size:13px;color:var(--gold)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:14px;color:var(--muted);background:transparent;border:0;padding:7px 14px;min-height:36px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--panel);color:var(--text);font-weight:600}
.eyebrow{margin:6px 0 2px;color:var(--gold);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
h1{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.2;margin:0 0 6px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:18px 0 2px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.6}
.note{border-left:3px solid var(--gold);background:rgba(201,162,75,.10);padding:8px 12px;border-radius:6px;font-size:14px}
label.f{display:block;font-weight:600;font-size:15px;margin:14px 0 6px}
.hint{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:2px}
input[type=text],input[type=tel],input[type=date],select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:48px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--sky2);outline-offset:2px}
.bad input,.bad select,.bad canvas{border-color:var(--red)!important}
.bad .opt span,.bad .trip span{border-color:var(--red)}
.err{color:var(--red);font-size:14px;margin:6px 0 0}
.err:empty{display:none}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:600;font-size:15px;padding:0;margin:14px 0 8px}
.q legend{float:left;width:100%;margin:0 0 8px}
.q .yn{clear:both}
.q + .q{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.req{color:var(--muted);font-weight:400;font-size:13px}
.yn{display:flex;gap:10px}
.opt{position:relative;flex:1;display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:block;text-align:center;padding:12px 10px;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-weight:600}
.opt input:checked + span{background:var(--sky);border-color:var(--sky);color:#06101f}
.opt input:focus-visible + span{outline:2px solid var(--sky2);outline-offset:2px}
.trips{display:grid;gap:10px}
.trip{position:relative;display:block;cursor:pointer}
.trip input{position:absolute;opacity:0;width:1px;height:1px}
.trip span{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.trip b{display:block;font-size:16px}
.trip i{display:block;font-style:normal;color:var(--muted);font-size:14px}
.trip input:checked + span{border-color:var(--sky);box-shadow:inset 0 0 0 1px var(--sky);background:#123055}
.trip input:focus-visible + span{outline:2px solid var(--sky2);outline-offset:2px}
.fixed b{display:block;font-size:17px}
.fixed i{display:block;font-style:normal;color:var(--muted);font-size:14px}
.padwrap{position:relative}
canvas{display:block;width:100%;aspect-ratio:5/2;background:var(--paper);border:1px solid var(--line);border-radius:12px;touch-action:none;cursor:crosshair}
.row{display:flex;justify-content:flex-end;margin-top:6px}
button{font:inherit}
.link{background:none;border:0;color:var(--sky2);font-size:15px;padding:8px 2px;min-height:40px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.primary{display:block;width:100%;min-height:54px;margin:18px 0 10px;font-size:17px;font-weight:700;color:#06101f;background:var(--sky);border:0;border-radius:12px;cursor:pointer}
.primary[disabled]{opacity:.6;cursor:progress}
.secondary{display:block;width:100%;min-height:50px;margin:10px 0;font-size:16px;font-weight:600;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.formerr{color:var(--red);font-weight:600;margin:14px 0 0}
.formerr:empty{display:none}
.footer{color:var(--muted);font-size:13.5px;margin-top:18px}
.footer a{color:var(--sky2)}
.check{width:64px;height:64px;margin:28px 0 12px}
</style>
</head>
<body>
<main>
  <header class="top">
    <span class="brand">DAEDALUS</span>
    <div class="lang" role="group" aria-label="Språk / Language">
      <button type="button" data-lang="no" aria-pressed="true">Norsk</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </header>

  <section id="vLoading"><p class="muted" data-t="loading"></p></section>

  <section id="vError" hidden>
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 id="errTitle"></h1>
    <p id="errMsg" role="alert"></p>
    <button id="btnRetry" class="secondary" type="button" hidden></button>
  </section>

  <form id="vForm" hidden novalidate autocomplete="off">
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 id="orgName"></h1>

    <div class="card" id="tripCard">
      <h2 data-t="trip"></h2>
      <div id="w-trip"><div id="tripBox"></div>
      <p class="err" id="e-trip"></p></div>
    </div>

    <div class="card">
      <h2 id="textTitle"></h2>
      <p class="note" id="textNote" hidden></p>
      <div class="text" id="textBody"></div>
    </div>

    <div class="card" id="qCard" hidden>
      <div id="qList"></div>
      <p class="err" id="e-answers"></p>
    </div>

    <div class="card">
      <fieldset id="w-u18">
        <legend data-t="u18" style="margin-top:0"></legend>
        <p class="muted small" data-t="u18Hint"></p>
        <div class="yn">
          <label class="opt"><input type="radio" name="u18" value="yes"><span data-t="yes"></span></label>
          <label class="opt"><input type="radio" name="u18" value="no"><span data-t="no"></span></label>
        </div>
        <p class="err" id="e-u18"></p>
      </fieldset>
    </div>

    <div class="card">
      <h2 data-t="about"></h2>
      <p class="muted small" id="childHint" data-t="childHint" hidden></p>
      <div id="w-name"><label class="f" for="f-name" data-t="name"></label><input type="text" id="f-name" autocomplete="off" enterkeyhint="next" maxlength="200"><p class="err" id="e-name"></p></div>
      <div id="w-phone"><label class="f" for="f-phone" data-t="phone"></label><input type="tel" id="f-phone" autocomplete="off" enterkeyhint="next" inputmode="tel" maxlength="40"><p class="err" id="e-phone"></p></div>
      <div id="w-birth_date" hidden><label class="f" for="f-birth" data-t="birth"></label><input type="date" id="f-birth" autocomplete="off" enterkeyhint="next" min="1900-01-01"><p class="err" id="e-birth_date"></p></div>
      <div id="w-language"><label class="f" for="f-lang" data-t="langLabel"></label>
        <select id="f-lang" autocomplete="off">
          <option value="" data-t="langNone"></option>
          <option value="no">Norsk</option><option value="en">English</option><option value="de">Deutsch</option>
          <option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option>
          <option value="nl">Nederlands</option><option value="sv">Svenska</option><option value="da">Dansk</option>
          <option value="fi">Suomi</option><option value="pl">Polski</option><option value="zh">中文</option><option value="ja">日本語</option>
        </select><p class="err" id="e-language"></p></div>
      <h3 data-t="ec"></h3>
      <p class="muted small" data-t="ecHint"></p>
      <div id="w-emergency_name"><label class="f" for="f-ecName" data-t="ecName"></label><input type="text" id="f-ecName" autocomplete="off" enterkeyhint="next" maxlength="200"><p class="err" id="e-emergency_name"></p></div>
      <div id="w-emergency_phone"><label class="f" for="f-ecPhone" data-t="ecPhone"></label><input type="tel" id="f-ecPhone" autocomplete="off" enterkeyhint="next" inputmode="tel" maxlength="40"><p class="err" id="e-emergency_phone"></p></div>
    </div>

    <div class="card" id="guardianCard" hidden>
      <h2 data-t="guardianTitle"></h2>
      <div id="w-guardian_name"><label class="f" for="f-gName" data-t="gName"></label><input type="text" id="f-gName" autocomplete="off" enterkeyhint="next" maxlength="200"><p class="err" id="e-guardian_name"></p></div>
      <div id="w-guardian_relation"><label class="f" for="f-gRel" data-t="gRel"></label><input type="text" id="f-gRel" autocomplete="off" enterkeyhint="next" maxlength="100" data-ph="gRelPh"><p class="err" id="e-guardian_relation"></p></div>
    </div>

    <div class="card" id="w-signature">
      <h2 id="sigLabel"></h2>
      <p class="muted small" data-t="signHint"></p>
      <div class="padwrap"><canvas id="pad" role="img" data-aria="padAria"></canvas></div>
      <div class="row"><button type="button" class="link" id="btnClear" data-t="clear"></button></div>
      <p class="err" id="e-signature"></p>
      <p class="muted small" id="confirmLine"></p>
      <p class="muted small" data-t="sigAlt"></p>
    </div>

    <p class="formerr" id="formErr" role="alert"></p>
    <button id="btnSend" class="primary" type="submit" data-t="send"></button>
    <button id="btnReload" class="secondary" type="button" data-t="reload" hidden></button>
    <p class="footer" id="privacyLine"></p>
  </form>

  <section id="vDone" hidden>
    <svg class="check" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="none" stroke="#7fd19b" stroke-width="3"/><path d="M19 33l9 9 17-19" fill="none" stroke="#7fd19b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1 id="doneTitle" tabindex="-1" data-t="doneTitle"></h1>
    <p id="doneMsg" role="status"></p>
    <button id="btnAnother" class="primary" type="button" data-t="another"></button>
    <button id="btnFinish" class="secondary" type="button" data-t="finish"></button>
    <p id="finishMsg" class="muted" data-t="finishMsg" hidden></p>
  </section>
</main>
<script>
(function () {

  var T = {
    no: {
      loading: 'Henter erklæringen …', eyebrow: 'Erklæring før turen', errTitle: 'Erklæringen kan ikke vises',

      noTripsTitle: 'No trips to choose yet', noTrips: 'None of today’s trips are accepting declarations right now. Please ask your guide, and load the list again once the trip has been added.',
      ret: 'Returns around {t}', guide: 'Guide: {g}',

      u18: 'Is the participant under 18?', u18Hint: 'A parent or guardian signs for the participant.', u18Missing: 'Answer whether the participant is under 18.',
      about: 'Participant', childHint: 'Fill in the details of the child.',
      name: 'Full name', phone: 'Mobile number', birth: 'Date of birth',
      langLabel: 'Preferred language on the trip (optional)', langNone: 'Not stated',
      ec: 'Emergency contact', ecHint: 'Someone we can call if something happens.', ecName: 'Name', ecPhone: 'Phone',
      guardianTitle: 'Parent or guardian', gName: 'Name of parent or guardian', gRel: 'Relationship to the child', gRelPh: 'For example mother or father',
      sig: 'Signature', sigGuardian: 'Signature of parent or guardian', signHint: 'Sign with your finger in the box below.',
      padAria: 'Signature box', clear: 'Clear the box', sigAlt: 'Can’t sign here? Please tell your guide.',
      confirm: 'By signing, you confirm that you have read the declaration above.',
      confirmGuardian: 'By signing, you confirm that you have read the declaration above and are signing for the child.',
      send: 'Send', sending: 'Sending …',
      missing: 'Please fill in this field.', phoneBad: 'Please enter a phone number with at least five digits.', chooseYN: 'Please choose yes or no.',
      dateBad: 'Please enter a valid date.', sigMissing: 'Please sign in the box.', fix: 'Something is missing. Please see the marked fields.',
      doneTitle: 'Thank you', doneMsg: '{name} is registered for {trip}.', doneAlready: '{name} was already registered for {trip}.',

  };

  var $ = function (id) { return document.getElementById(id); };
  var each = function (sel, fn, root) { Array.prototype.forEach.call((root || document).querySelectorAll(sel), fn); };
  var params = new URLSearchParams(location.search);
  var token = params.get('t') || params.get('o') || '';
  var TOKEN_RE = /^[A-Za-z0-9_-]{24}$/;
  var FORMAT = /\p{Cf}/gu;
  var lang = pickLang();
  var data = null;          // svaret fra oppslaget
  var shown = null;         // teksten som vises: { lang, hash }
  var tripId = null;
  var person = newPerson();
  var busy = false;
  var pendingFp = null;     // innholdet i et forsøk med ukjent utfall (nettfeil, tidsavbrudd, serverfeil)
  var lastDone = null;      // { key, name, trip }
  var errs = {};            // felt → { k, vars } eller { m: { no, en } }
  var badQ = {};            // spørsmål som mangler svar
  var formMsg = null;
  var errView = null;       // { e, retry, retryKey, titleKey, hash }
  var langTouched = false;

  function pickLang() {
    var p = (params.get('lang') || '').toLowerCase();
    if (p === 'en') return 'en';
    if (p === 'no' || p === 'nb' || p === 'nn') return 'no';
    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
    for (var i = 0; i < list.length; i++) { if (/^(nb|nn|no)\b/i.test(list[i])) return 'no'; }
    return 'en';
  }
  function t(k, vars) {
    var s = (T[lang] && T[lang][k]) || T.no[k] || k;
    if (vars) Object.keys(vars).forEach(function (v) { s = s.split('{' + v + '}').join(vars[v]); });
    return s;
  }
  function say(e) { if (!e) return ''; if (e.m) return e.m[lang] || e.m.no || ''; return t(e.k, e.vars); }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    var h = Array.from(b, function (x) { return x.toString(16).padStart(2, '0'); }).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }
  // Id-ene lages én gang per person og gjenbrukes ved nytt forsøk med samme innhold (dobbelt trykk
  // gir samme id-er). Nye id-er etter en lagring, ved ids_used, og når innholdet endres etter et

  function newPerson() { return { pid: uuid(), sid: uuid() }; }
  function clean(s) { return String(s || '').normalize('NFC').replace(/[\x00-\x08\x0e-\x1f\x7f]/g, '').replace(FORMAT, '').replace(/\s+/g, ' ').trim(); }

  // Samme normalisering som databasen (decl_normalize). Linjeslutt fjernes med /[ \t]+(?=\n|$)/g, aldri /gm.
  function declNormalize(s) {
    return s.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/[ \t]+(?=\n|$)/g, '').replace(/^\n+/, '').replace(/\n+$/, '').normalize('NFC');
  }
  function sha256hex(s) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (b) {
      return Array.from(new Uint8Array(b), function (x) { return x.toString(16).padStart(2, '0'); }).join('');
    });
  }

  function call(body, ms) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, ms) : 0;
    return fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': KEY }, body: JSON.stringify(body), cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.text().then(function (s) { var j = null; try { j = JSON.parse(s); } catch (e) { /* ikke fra funksjonen */ } return { status: r.status, json: j }; }); })
      .then(function (x) { clearTimeout(timer); return x; }, function () { clearTimeout(timer); return null; });
  }

  function show(id) { ['vLoading', 'vError', 'vForm', 'vDone'].forEach(function (v) { $(v).hidden = v !== id; }); }
  function showError(e, retry, retryKey, titleKey) {
    errView = { e: e, retry: !!retry, retryKey: retryKey || 'retry', titleKey: titleKey || 'errTitle', hash: false };
    paintErrorView();
    show('vError');
  }
  function paintErrorView() {
    if (!errView) return;
    $('errTitle').textContent = t(errView.titleKey);
    $('errMsg').textContent = say(errView.e);
    $('btnRetry').hidden = !errView.retry;
    $('btnRetry').textContent = t(errView.retryKey);
  }

  // ---------- feilmeldinger som følger språket ----------
  function setErr(key, e) { if (e) errs[key] = e; else delete errs[key]; paintErr(key); }
  function paintErr(key) {
    var e = errs[key], el = $('e-' + key), w = $('w-' + key);
    if (el) el.textContent = say(e);
    if (!w) return;
    w.classList.toggle('bad', !!e);
    each('input:not([type=radio]),select', function (x) {
      if (e) { x.setAttribute('aria-invalid', 'true'); x.setAttribute('aria-describedby', 'e-' + key); }
      else { x.removeAttribute('aria-invalid'); x.removeAttribute('aria-describedby'); }
    }, w);
  }
  function setFormMsg(e) { formMsg = e; $('formErr').textContent = say(e); }
  function clearErrors() {
    Object.keys(errs).forEach(function (k) { setErr(k, null); });
    badQ = {};
    each('.q.bad', function (q) { q.classList.remove('bad'); });
    setFormMsg(null);
    $('btnReload').hidden = true;
  }

  // ---------- statiske tekster og språk ----------
  function applyStatic() {
    document.documentElement.lang = lang === 'en' ? 'en' : 'nb';
    document.title = (lang === 'en' ? 'Declaration' : 'Erklæring') + ' · Daedalus';
    each('[data-t]', function (el) { el.textContent = t(el.getAttribute('data-t')); });
    each('[data-ph]', function (el) { el.placeholder = t(el.getAttribute('data-ph')); });
    each('[data-aria]', function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-aria'))); });
    each('.lang button', function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
    $('btnSend').textContent = busy ? t('sending') : t('send');
  }
  each('.lang button', function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang');
      applyStatic();
      if (!$('vDone').hidden) { if (lastDone) $('doneMsg').textContent = t(lastDone.key, lastDone); }
      else if (data) renderAll(false);
      Object.keys(errs).forEach(paintErr);
      $('formErr').textContent = say(formMsg);
      paintErrorView();
    });
  });

  // ---------- oppslag ----------
  function load() {
    show('vLoading');
    if (!TOKEN_RE.test(token)) { showError({ k: 'noToken' }, false); return; }
    call({ action: 'lookup', token: token }, 15000).then(function (r) {
      if (!r) { showError({ k: 'network' }, true); return; }
      var j = r.json;
      if (!j || (!j.ok && !j.code)) { showError({ k: 'unavailable' }, true); return; }
      if (!j.ok) { showError({ m: j.message }, r.status >= 500 || r.status === 429); return; }
      data = j;
      var list = data.trips || [];
      if (data.kind === 'trip') tripId = list.length ? list[0].id : null;
      else if (tripId && !list.some(function (x) { return x.id === tripId; })) tripId = null;
      renderAll(true);
    });
  }
  $('btnRetry').addEventListener('click', load);
  $('btnReload').addEventListener('click', function () { location.reload(); });

  function renderAll(fromLoad) {
    if (data.kind === 'org' && !(data.trips || []).length) { showError({ k: 'noTrips' }, true, 'refresh', 'noTripsTitle'); return; }
    $('orgName').textContent = data.organization.name;
    renderTrips();
    renderQuestions();
    $('w-birth_date').hidden = !data.text.requires_birth_date;
    $('f-birth').max = new Date().toISOString().slice(0, 10);
    if (!langTouched) $('f-lang').value = lang;
    renderU18();
    renderPrivacy();
    // Språkbytte på takkesiden blir der; skjemaet vises fra lasting, fra skjemaet selv, eller når
    // teksten på det nye språket kan bekreftes etter en hashfeil på det forrige.
    renderText().then(function (ok) {
      if (!ok) { showError({ k: 'hashFail' }, false); errView.hash = true; return; }
      var afterHashFail = errView && errView.hash && !$('vError').hidden;
      if (fromLoad || !$('vForm').hidden || afterHashFail) { errView = null; show('vForm'); sizePad(); }
    });
  }

  function renderTrips() {
    var box = $('tripBox');
    box.textContent = '';
    var list = data.trips || [];
    $('btnSend').disabled = busy;
    if (data.kind === 'trip') {
      var tr = list[0];
      var d = document.createElement('div'); d.className = 'fixed';
      d.appendChild(el('b', tr ? tr.name : ''));
      if (tr) tripMeta(tr).forEach(function (m) { d.appendChild(el('i', m)); });
      box.appendChild(d);
      return;
    }
    // Orgkode: gjesten velger alltid selv, også når det bare er én tur (to busser, to turer).
    box.appendChild(el('p', t('chooseTrip'), 'muted small'));
    var g = document.createElement('div'); g.className = 'trips'; g.setAttribute('role', 'radiogroup');
    g.setAttribute('aria-label', t('chooseTrip'));
    list.forEach(function (tr) {
      var l = document.createElement('label'); l.className = 'trip';
      var i = document.createElement('input'); i.type = 'radio'; i.name = 'trip'; i.value = tr.id; i.checked = tr.id === tripId;
      i.addEventListener('change', function () { tripId = tr.id; setErr('trip', null); });
      var s = document.createElement('span');
      s.appendChild(el('b', tr.name));
      tripMeta(tr).forEach(function (m) { s.appendChild(el('i', m)); });
      l.appendChild(i); l.appendChild(s); g.appendChild(l);
    });
    box.appendChild(g);
  }
  function tripMeta(tr) {
    var out = [];
    if (tr.return_time) out.push(t('ret', { t: tr.return_time }));
    if (tr.guide_name) out.push(t('guide', { g: tr.guide_name }));
    return out;
  }
  function el(tag, text, cls) { var e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; return e; }

  // Teksten vises på valgt språk når den finnes, ellers på det andre. Hashen sjekkes før noen kan signere.
  // Tittelen følger språket teksten vises på (text_language): title_en for engelsk tekst når den finnes, ellers title.
  function renderText() {
    var tx = data.text;
    var want = lang, other = lang === 'en' ? 'no' : 'en';
    var use = tx['body_' + want] ? want : other;
    var norm = declNormalize(tx['body_' + use] || '');
    var expected = tx['hash_' + use];
    $('textTitle').textContent = use === 'en' && tx.title_en ? tx.title_en : tx.title;
    $('textBody').textContent = norm;
    $('textNote').hidden = use === want;
    $('textNote').textContent = use === 'no' ? t('onlyNo') : t('onlyEn');
    return sha256hex(norm).then(function (h) {
      if (!expected || h !== expected) { shown = null; return false; }
      shown = { lang: use, hash: h };
      return true;
    });
  }

  function renderQuestions() {
    var qs = data.text.questions || [];
    $('qCard').hidden = !qs.length;
    var box = $('qList');
    var prev = {};
    each('input:checked', function (i) { prev[i.name] = i.value; }, box);
    box.textContent = '';
    qs.forEach(function (q) {
      var fs = document.createElement('fieldset'); fs.className = 'q' + (badQ[q.key] ? ' bad' : ''); fs.id = 'w-q-' + q.key;
      var lg = document.createElement('legend');
      lg.textContent = (lang === 'en' ? (q.label_en || q.label_no) : (q.label_no || q.label_en)) || q.key;
      if (q.required) { lg.appendChild(document.createTextNode(' ')); lg.appendChild(el('span', '(' + t('required') + ')', 'req')); }
      fs.appendChild(lg);
      var yn = document.createElement('div'); yn.className = 'yn';
      [['true', t('yes')], ['false', t('no')]].forEach(function (o) {
        var l = document.createElement('label'); l.className = 'opt';
        var i = document.createElement('input'); i.type = 'radio'; i.name = 'q-' + q.key; i.value = o[0];
        i.checked = prev['q-' + q.key] === o[0];
        i.addEventListener('change', function () { delete badQ[q.key]; fs.classList.remove('bad'); });
        l.appendChild(i); l.appendChild(el('span', o[1])); yn.appendChild(l);
      });
      fs.appendChild(yn);
      box.appendChild(fs);
    });
  }

  function u18() { var c = document.querySelector('input[name=u18]:checked'); return c ? c.value : null; }
  function renderU18() {
    var g = u18() === 'yes';
    $('guardianCard').hidden = !g;
    $('childHint').hidden = !g;
    $('sigLabel').textContent = g ? t('sigGuardian') : t('sig');
    $('confirmLine').textContent = g ? t('confirmGuardian') : t('confirm');
  }
  each('input[name=u18]', function (i) { i.addEventListener('change', function () { setErr('u18', null); renderU18(); }); });
  $('f-lang').addEventListener('change', function () { langTouched = true; });

  function renderPrivacy() {
    var p = $('privacyLine');
    p.textContent = t('privacy', { org: data.organization.name }) + ' ';
    var a = document.createElement('a');
    a.href = '/privacy?lang=' + (lang === 'en' ? 'en' : 'no');
    a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = t('privacyLink');
    p.appendChild(a);
  }

  // Enter eller «Neste» flytter til neste felt og sender aldri skjemaet.
  $('vForm').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !e.target || e.target.tagName !== 'INPUT') return;
    e.preventDefault();
    if (e.target.type === 'radio') return;
    var list = Array.prototype.filter.call($('vForm').querySelectorAll('input[type=text],input[type=tel],input[type=date],select'), function (x) { return x.offsetParent !== null; });
    var i = list.indexOf(e.target);
    if (i > -1 && i < list.length - 1) list[i + 1].focus(); else e.target.blur();
  });

  // ---------- signaturfeltet ----------
  var canvas = $('pad'), ctx = canvas.getContext('2d');
  var pad = { strokes: [], cur: null, w: 0, h: 0, points: 0 };
  var active = null;   // pekeren som tegner nå; andre fingre og håndflaten overses
  var MAX_POINTS = 3800;
  function sizePad() {
    var w = canvas.clientWidth, h = canvas.clientHeight;   // uten rammen
    if (!w) return;
    if (pad.w && Math.abs(w - pad.w) > 0.5) {
      var k = w / pad.w;
      pad.strokes.forEach(function (s) { for (var i = 0; i < s.length; i++) s[i] = Math.round(s[i] * k * 10) / 10; });
    }
    pad.w = w; pad.h = h;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }
  function redraw() {
    ctx.clearRect(0, 0, pad.w, pad.h);
    ctx.strokeStyle = 'rgba(10,19,34,.25)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(16, pad.h * 0.75); ctx.lineTo(pad.w - 16, pad.h * 0.75); ctx.stroke();
    ctx.strokeStyle = '#0a1322'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    pad.strokes.forEach(function (s) {
      if (!s.length) return;
      ctx.beginPath(); ctx.moveTo(s[0], s[1]);
      if (s.length === 2) ctx.lineTo(s[0] + 0.1, s[1] + 0.1);
      for (var i = 2; i < s.length; i += 2) ctx.lineTo(s[i], s[i + 1]);
      ctx.stroke();
    });
  }
  function pt(e) {
    var r = canvas.getBoundingClientRect();
    return [Math.round((e.clientX - r.left - canvas.clientLeft) * 10) / 10, Math.round((e.clientY - r.top - canvas.clientTop) * 10) / 10];
  }
  function inside(p) { return p[0] >= 0 && p[1] >= 0 && p[0] <= pad.w && p[1] <= pad.h; }
  function startStroke(p) {
    if (pad.points >= MAX_POINTS) return;
    pad.cur = [p[0], p[1]]; pad.points++;
    pad.strokes.push(pad.cur);
    setErr('signature', null);
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (e.button > 0 || active !== null || e.isPrimary === false) return;
    e.preventDefault();
    active = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch (x) { /* eldre nettlesere */ }
    var p = pt(e);
    if (inside(p)) startStroke(p);
    redraw();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (e.pointerId !== active) return;
    e.preventDefault();
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length && pad.points < MAX_POINTS; i++) {
      var p = pt(evs[i]);
      // Utenfor feltet avsluttes strøket; tilbake i feltet begynner et nytt. Ingen streker langs kanten.
      if (!inside(p)) { pad.cur = null; continue; }
      if (!pad.cur) { startStroke(p); continue; }
      var n = pad.cur.length, dx = p[0] - pad.cur[n - 2], dy = p[1] - pad.cur[n - 1];
      if (dx * dx + dy * dy < 1) continue;
      pad.cur.push(p[0], p[1]); pad.points++;
    }
    redraw();
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) {
    canvas.addEventListener(ev, function (e) { if (e.pointerId === active) { active = null; pad.cur = null; } });
  });
  $('btnClear').addEventListener('click', function () { pad.strokes = []; pad.cur = null; pad.points = 0; redraw(); });
  window.addEventListener('resize', sizePad);
  // Samme regel som funksjonen: bare strøk med minst to punkter teller, minst fem punkter og 15 px utstrekning.
  function padValid() {
    var n = 0, minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    pad.strokes.forEach(function (s) {
      if (s.length < 4) return;
      for (var i = 0; i < s.length; i += 2) { n++; minX = Math.min(minX, s[i]); maxX = Math.max(maxX, s[i]); minY = Math.min(minY, s[i + 1]); maxY = Math.max(maxY, s[i + 1]); }
    });
    return n >= 5 && Math.max(maxX - minX, maxY - minY) >= 15;
  }

  // ---------- skjemaet ----------
  var FIELD = { name: 'name', phone: 'phone', emergency_name: 'emergency_name', emergency_phone: 'emergency_phone', language: 'language',
    birth_date: 'birth_date', guardian_name: 'guardian_name', guardian_relation: 'guardian_relation', answers: 'answers', signature: 'signature' };
  function v(id) { return clean($(id).value); }
  function okPhone(s) { return /^[0-9+()\-./ ]+$/.test(s) && (s.match(/[0-9]/g) || []).length >= 5; }

  function collect() {
    clearErrors();
    var bad = 0;
    function need(key, ok, k) { if (!ok) { setErr(key, { k: k }); bad++; } }
    need('trip', !!tripId, 'chooseTrip');
    var answers = Object.create(null);
    (data.text.questions || []).forEach(function (q) {
      var c = document.querySelector('input[name="q-' + q.key + '"]:checked');
      if (c) answers[q.key] = c.value === 'true';
      else if (q.required) { badQ[q.key] = true; $('w-q-' + q.key).classList.add('bad'); }
    });
    if (Object.keys(badQ).length) { setErr('answers', { k: 'chooseYN' }); bad++; }
    var u = u18();
    need('u18', !!u, 'u18Missing');
    var name = v('f-name'), phone = v('f-phone'), ecName = v('f-ecName'), ecPhone = v('f-ecPhone');
    need('name', !!name, 'missing');
    need('phone', okPhone(phone), phone ? 'phoneBad' : 'missing');
    var birth = null;
    if (data.text.requires_birth_date) {
      birth = $('f-birth').value;
      need('birth_date', /^\d{4}-\d{2}-\d{2}$/.test(birth), birth ? 'dateBad' : 'missing');
    }
    need('emergency_name', !!ecName, 'missing');
    need('emergency_phone', okPhone(ecPhone), ecPhone ? 'phoneBad' : 'missing');
    var gName = null, gRel = null;
    if (u === 'yes') {
      gName = v('f-gName'); gRel = v('f-gRel');
      need('guardian_name', !!gName, 'missing');
      need('guardian_relation', !!gRel, 'missing');
    }
    need('signature', padValid(), 'sigMissing');
    if (bad || !shown) {
      setFormMsg({ k: 'fix' });
      var first = document.querySelector('#vForm .bad');
      if (first) {
        var f = first.querySelector('input:not([type=radio]),select') || first.querySelector('input');
        if (f) f.focus({ preventScroll: true });
        first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return null;
    }
    return {
      action: 'sign', token: token,
      participant: { id: person.pid, trip_id: tripId, name: name, phone: phone, emergency_name: ecName, emergency_phone: ecPhone,
        language: $('f-lang').value || null, birth_date: birth },
      signature: { id: person.sid, signer_role: u === 'yes' ? 'guardian' : 'self', guardian_name: gName, guardian_relation: gRel,
        text_id: data.text.id, text_version: data.text.version, text_language: shown.lang, text_hash: shown.hash, answers: answers,
        drawing: { width: Math.round(pad.w), height: Math.round(pad.h), strokes: pad.strokes.filter(function (s) { return s.length; }) } }
    };
  }
  function fingerprint(p) {
    var c = JSON.parse(JSON.stringify(p));
    delete c.participant.id; delete c.signature.id;
    return JSON.stringify(c);
  }
  function setSending(on) { busy = on; $('btnSend').disabled = on; $('btnSend').textContent = on ? t('sending') : t('send'); }

  $('vForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    var payload = collect();
    if (!payload) return;
    // Etter et forsøk med ukjent utfall: samme id-er bare for nøyaktig samme innhold. Er noe endret
    // (rettet felt, ny tegning, en annen gjest på guidens telefon), får personen nye id-er.
    if (pendingFp !== null && fingerprint(payload) !== pendingFp) {
      person = newPerson();
      payload.participant.id = person.pid; payload.signature.id = person.sid;
      pendingFp = null;
    }
    setSending(true);
    call(payload, 20000).then(function (r) {
      setSending(false);
      var j = r && r.json;
      if (!r || !j || (!j.ok && !j.code) || (!j.ok && r.status >= 500)) {
        pendingFp = fingerprint(payload);
        setFormMsg(!r ? { k: 'network' } : (j && j.code ? { m: j.message } : { k: 'unavailable' }));
        return;
      }
      pendingFp = null;
      if (j.ok) {
        var tr = (data.trips || []).filter(function (x) { return x.id === tripId; })[0];
        lastDone = { key: j.already ? 'doneAlready' : 'doneMsg', name: payload.participant.name, trip: tr ? tr.name : '' };
        $('doneMsg').textContent = t(lastDone.key, lastDone);
        $('finishMsg').hidden = true; $('btnAnother').hidden = false; $('btnFinish').hidden = false;
        show('vDone');
        window.scrollTo(0, 0);
        $('doneTitle').focus({ preventScroll: true });
        return;
      }
      if (j.code === 'ids_used') person = newPerson(); // nye id-er før neste forsøk
      if (j.code === 'text_changed') $('btnReload').hidden = false;
      if (j.field && FIELD[j.field]) setErr(FIELD[j.field], { m: j.message });
      setFormMsg({ m: j.message });
    });
  });

  // Neste person på samme telefon: alt om personen tømmes, turlista og teksten hentes på nytt.
  function resetPerson() {
    person = newPerson(); pendingFp = null; lastDone = null; langTouched = false;
    ['f-name', 'f-phone', 'f-ecName', 'f-ecPhone', 'f-gName', 'f-gRel', 'f-birth'].forEach(function (id) { $(id).value = ''; });
    each('#vForm input[type=radio]', function (i) { if (i.name !== 'trip') i.checked = false; });
    pad.strokes = []; pad.cur = null; pad.points = 0; active = null;
    clearErrors();
    renderU18();
  }
  $('btnAnother').addEventListener('click', function () { resetPerson(); window.scrollTo(0, 0); load(); });
  $('btnFinish').addEventListener('click', function () { $('btnAnother').hidden = true; $('btnFinish').hidden = true; $('finishMsg').hidden = false; });

  if (window.ResizeObserver) new ResizeObserver(function () { sizePad(); }).observe(canvas);
  applyStatic();
  load();
})();
</script>
</body>
</html>
