<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siden finnes ikke – Daedalus</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1322">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg0:#0a1322;--bg1:#0e1a30;--panel:#16273f;--line:#284063;--sky:#4a9fe0;--gold:#c9a24b;--gold2:#e3c071;--text:#e7ecf3;--muted:#8b98ab}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#13233f 0%,var(--bg0) 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:48px 20px}
main{max-width:560px;width:100%}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:40px;text-decoration:none;color:var(--text)}
.brand img{width:36px;height:36px;border-radius:8px}
.brand b{font-size:13px;letter-spacing:.22em;text-transform:uppercase}
.kicker{color:var(--gold);font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin:0 0 14px}
h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:0 0 16px;letter-spacing:-.01em}
p{color:var(--muted);font-size:16px;line-height:1.6;margin:0 0 26px}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links a{display:inline-block;padding:11px 18px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none;font-weight:500;font-size:14.5px;background:rgba(22,39,63,.55)}
.links a.primary{background:linear-gradient(135deg,#2f6db0,#3676b8);border-color:transparent;color:#fff}
.links a:hover{border-color:var(--sky)}
.en{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.en a{color:var(--gold2)}
</style>
</head>
<body>
<main>
<a class="brand" href="/"><img src="/icon.png" alt=""><b>Høi Z · Daedalus</b></a>
<p class="kicker">404</p>
<h1>Denne siden finnes ikke.</h1>
<p>Lenken kan være gammel, eller adressen er skrevet feil. Alt som er publisert ligger på forsiden og under nyheter.</p>
<div class="links">
<a class="primary" href="/">Til forsiden</a>
<a href="/nyheter">Nyheter</a>
<a href="/svalbard">Svalbard 2027</a>
</div>
<p class="en">This page does not exist. The link may be old or mistyped. <a href="/">Go to the front page</a>.</p>
</main>
</body>
</html>
